<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotify Tagger</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: #111;
            color: white;
        }

        h1, h2, h3 {
            margin-bottom: 10px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1px solid #555;
            background: #222;
            color: white;
        }

        button {
            padding: 10px 15px;
            margin: 6px 3px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .card {
            background: #1d1d1d;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
        }

        .genre {
            display: inline-block;
            background: #333;
            padding: 5px 8px;
            margin: 3px;
            border-radius: 6px;
            font-size: 13px;
        }

        a {
            color: #7dd3fc;
        }

        #error {
            color: #ff7777;
            white-space: pre-wrap;
        }

        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #444;
        }
    </style>
</head>

<body>

    <h1>🎵 Spotify Tagger</h1>

    <!-- LOGIN -->

    <div id="login">

        <p>
            Organizador pessoal de músicas.
        </p>

        <button onclick="login()">
            Entrar com Spotify
        </button>

    </div>


    <!-- APLICATIVO -->

    <div id="app" style="display:none">

        <h2>🔎 Interseção de gêneros</h2>

        <p>
            Encontre artistas que possuem
            <strong>os dois gêneros</strong>.
        </p>

        <input
            id="genre1"
            placeholder="Primeiro gênero"
        >

        <input
            id="genre2"
            placeholder="Segundo gênero"
        >

        <button onclick="searchIntersection()">
            🔎 Encontrar interseção
        </button>

        <div id="results"></div>


        <hr>


        <h2>🏷️ Minhas tags</h2>

        <input
            id="newTag"
            placeholder="Nome da tag"
        >

        <button onclick="addTag()">
            Criar tag
        </button>

        <div id="tags"></div>


        <hr>


        <h2>🎵 Playlist</h2>

        <input
            id="playlistName"
            placeholder="Nome da playlist"
        >

        <button onclick="createPlaylist()">
            Criar playlist
        </button>

        <p id="status"></p>

    </div>


    <div id="error"></div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const CLIENT_ID =
    "980934f51c13469db6110b783f5c6f5b";

const REDIRECT_URI =
    "https://perroalio-dev.github.io/Spotfy-tagger/";

const SCOPES =
    "playlist-modify-public playlist-modify-private";

let accessToken = null;


/* =====================================================
   TAGS
===================================================== */

let tags =
    JSON.parse(
        localStorage.getItem("spotifyTags") || "{}"
    );

let selectedTag = null;


/* =====================================================
   PKCE
===================================================== */

function generateRandomString(length) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    for (let i = 0; i < length; i++) {

        result += characters.charAt(
            Math.floor(
                Math.random() * characters.length
            )
        );

    }

    return result;
}


async function sha256(plain) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(plain);

    return crypto.subtle.digest(
        "SHA-256",
        data
    );
}


function base64url(buffer) {

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(buffer)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const verifier =
        generateRandomString(64);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    const hashed =
        await sha256(verifier);

    const challenge =
        base64url(hashed);

    const params =
        new URLSearchParams({

            client_id:
                CLIENT_ID,

            response_type:
                "code",

            redirect_uri:
                REDIRECT_URI,

            code_challenge_method:
                "S256",

            code_challenge:
                challenge,

            scope:
                SCOPES

        });

    window.location =
        "https://accounts.spotify.com/authorize?"
        + params.toString();

}


/* =====================================================
   TROCAR CÓDIGO POR TOKEN
===================================================== */

async function exchangeCode(code) {

    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );

    if (!verifier) {

        throw new Error(
            "Código PKCE não encontrado. Faça login novamente."
        );

    }

    const body =
        new URLSearchParams({

            client_id:
                CLIENT_ID,

            grant_type:
                "authorization_code",

            code:
                code,

            redirect_uri:
                REDIRECT_URI,

            code_verifier:
                verifier

        });

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    body

            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            "Spotify Login ("
            + response.status
            + "): "
            + JSON.stringify(data)
        );

    }

    accessToken =
        data.access_token;

    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );

    localStorage.removeItem(
        "spotify_code_verifier"
    );

}


/* =====================================================
   CALLBACK DO SPOTIFY
===================================================== */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const error =
        params.get("error");

    if (error) {

        throw new Error(
            "Spotify recusou o login: "
            + error
        );

    }

    const code =
        params.get("code");

    if (!code) {
        return false;
    }

    await exchangeCode(code);

    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );

    return true;

}


/* =====================================================
   BUSCAR ARTISTAS
===================================================== */

async function searchArtists(query) {

    const response =
        await fetch(
            "https://api.spotify.com/v1/search?"
            + new URLSearchParams({

                q:
                    query,

                type:
                    "artist",

                limit:
                    "10"

            }),

            {

                headers: {

                    Authorization:
                        "Bearer "
                        + accessToken

                }

            }
        );

    const data =
        await response.json();


    /* TOKEN INVÁLIDO */

    if (response.status === 401) {

        accessToken = null;

        localStorage.removeItem(
            "spotify_access_token"
        );

        throw new Error(
            "LOGIN_EXPIRED"
        );

    }


    if (!response.ok) {

        throw new Error(
            "Spotify API ("
            + response.status
            + "): "
            + JSON.stringify(data)
        );

    }


    return data.artists.items;

}


/* =====================================================
   INTERSEÇÃO DE GÊNEROS
===================================================== */

async function searchIntersection() {

    const genre1 =
        document
            .getElementById("genre1")
            .value
            .trim()
            .toLowerCase();

    const genre2 =
        document
            .getElementById("genre2")
            .value
            .trim()
            .toLowerCase();

    const results =
        document.getElementById(
            "results"
        );


    if (!genre1 || !genre2) {

        results.innerHTML =
            "<p>Digite os dois gêneros.</p>";

        return;

    }


    if (!accessToken) {

        results.innerHTML = `
            <div class="card">

                <strong>
                    🔑 Login necessário
                </strong>

                <p>
                    Entre novamente com o Spotify.
                </p>

                <button onclick="login()">
                    Entrar com Spotify
                </button>

            </div>
        `;

        return;

    }


    results.innerHTML =
        "<p>🔎 Procurando...</p>";


    try {

        /*
         * Procuramos candidatos nos
         * dois gêneros.
         */

        const searches =
            await Promise.all([

                searchArtists(genre1),

                searchArtists(genre2)

            ]);


        /*
         * Remove artistas duplicados.
         */

        const artists =
            new Map();


        searches
            .flat()
            .forEach(artist => {

                artists.set(
                    artist.id,
                    artist
                );

            });


        /*
         * Consulta os gêneros de cada artista.
         */

        const detailedArtists =
            await Promise.all(

                [...artists.values()]
                    .map(
                        async artist => {

                            const response =
                                await fetch(
                                    "https://api.spotify.com/v1/artists/"
                                    + artist.id,
                                    {

                                        headers: {

                                            Authorization:
                                                "Bearer "
                                                + accessToken

                                        }

                                    }
                                );


                            if (response.status === 401) {

                                accessToken = null;

                                localStorage.removeItem(
                                    "spotify_access_token"
                                );

                                throw new Error(
                                    "LOGIN_EXPIRED"
                                );

                            }


                            if (!response.ok) {
                                return null;
                            }


                            return response.json();

                        }
                    )

            );


        /*
         * INTERSEÇÃO:
         *
         * O artista precisa ter
         * OS DOIS gêneros.
         */

        const matches =
            detailedArtists.filter(
                artist => {

                    if (
                        !artist ||
                        !artist.genres
                    ) {
                        return false;
                    }


                    const genres =
                        artist.genres.map(
                            genre =>
                                genre.toLowerCase()
                        );


                    return (

                        genres.includes(
                            genre1
                        )

                        &&

                        genres.includes(
                            genre2
                        )

                    );

                }
            );


        results.innerHTML = "";


        if (matches.length === 0) {

            results.innerHTML = `
                <div class="card">

                    <strong>
                        Nenhum resultado
                    </strong>

                    <p>
                        Nenhum artista encontrado
                        com os dois gêneros exatos.
                    </p>

                </div>
            `;

            return;

        }


        matches.forEach(
            artist => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card";


                const genresHTML =
                    artist.genres
                        .map(
                            genre =>
                                `<span class="genre">
                                    ${escapeHTML(genre)}
                                </span>`
                        )
                        .join("");


                card.innerHTML = `

                    <h3>
                        ${escapeHTML(
                            artist.name
                        )}
                    </h3>

                    <div>
                        ${genresHTML}
                    </div>

                    <p>
                        <a
                            href="${artist.external_urls.spotify}"
                            target="_blank"
                            rel="noopener"
                        >
                            Abrir no Spotify
                        </a>
                    </p>

                    <button>
                        🏷️ Adicionar à tag
                    </button>

                `;


                card
                    .querySelector("button")
                    .onclick =
                        () =>
                            addArtistToTag(
                                artist
                            );


                results.appendChild(
                    card
                );

            }
        );


    } catch (error) {


        if (
            error.message ===
            "LOGIN_EXPIRED"
        ) {

            results.innerHTML = `
                <div class="card">

                    <strong>
                        🔑 Sessão expirada
                    </strong>

                    <p>
                        Seu login do Spotify expirou.
                        Entre novamente.
                    </p>

                    <button onclick="login()">
                        Entrar novamente
                    </button>

                </div>
            `;

            return;

        }


        results.innerHTML = `
            <div class="card">

                <strong>
                    ❌ Erro
                </strong>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>
        `;

    }

}


/* =====================================================
   TAGS
===================================================== */

function addTag() {

    const input =
        document.getElementById(
            "newTag"
        );

    const name =
        input.value.trim();


    if (!name) {
        return;
    }


    if (!tags[name]) {

        tags[name] = [];

    }


    saveTags();

    input.value = "";

    updateTags();

}


function updateTags() {

    const container =
        document.getElementById(
            "tags"
        );

    container.innerHTML = "";


    Object.keys(tags)
        .forEach(tag => {

            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                tag
                + " ("
                + tags[tag].length
                + ")";


            button.onclick =
                () => {

                    selectedTag =
                        tag;

                    alert(
                        "Tag selecionada: "
                        + tag
                    );

                };


            container.appendChild(
                button
            );

        });

}


function addArtistToTag(artist) {

    if (!selectedTag) {

        alert(
            "Crie uma tag e selecione ela primeiro."
        );

        return;

    }


    if (!tags[selectedTag]) {

        tags[selectedTag] = [];

    }


    if (
        !tags[selectedTag]
            .includes(artist.id)
    ) {

        tags[selectedTag].push(
            artist.id
        );

    }


    saveTags();

    updateTags();


    alert(
        artist.name
        + " foi adicionado à tag "
        + selectedTag
    );

}


function saveTags() {

    localStorage.setItem(
        "spotifyTags",
        JSON.stringify(tags)
    );

}


/* =====================================================
   PLAYLIST
===================================================== */

async function createPlaylist() {

    if (!accessToken) {

        alert(
            "Entre com o Spotify primeiro."
        );

        return;

    }


    if (!selectedTag) {

        alert(
            "Selecione uma tag primeiro."
        );

        return;

    }


    const name =
        document
            .getElementById(
                "playlistName"
            )
            .value
            .trim()
        || selectedTag;


    try {

        const response =
            await fetch(
                "https://api.spotify.com/v1/me/playlists",
                {

                    method: "POST",

                    headers: {

                        Authorization:
                            "Bearer "
                            + accessToken,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            name:
                                name,

                            public:
                                false,

                            description:
                                "Criada pelo Spotify Tagger"

                        })

                }
            );


        if (response.status === 401) {

            accessToken = null;

            localStorage.removeItem(
                "spotify_access_token"
            );

            alert(
                "Sua sessão expirou. Entre novamente."
            );

            return;

        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                JSON.stringify(
                    data
                )
            );

        }


        document.getElementById(
            "status"
        ).textContent =
            "✅ Playlist criada: "
            + data.name;


    } catch (error) {

        document.getElementById(
            "status"
        ).textContent =
            "❌ "
            + error.message;

    }

}


/* =====================================================
   SEGURANÇA HTML
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   MOSTRAR APLICATIVO
===================================================== */

function showApp() {

    document.getElementById(
        "login"
    ).style.display =
        "none";

    document.getElementById(
        "app"
    ).style.display =
        "block";

    updateTags();

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function initialize() {

    try {

        /*
         * Primeiro verifica se estamos
         * voltando do Spotify.
         */

        const loggedIn =
            await handleCallback();

        if (loggedIn) {

            showApp();

            return;

        }


        /*
         * Se já existe um token salvo,
         * usamos ele.
         */

        const savedToken =
            localStorage.getItem(
                "spotify_access_token"
            );

        if (savedToken) {

            accessToken =
                savedToken;

            showApp();

        }

    } catch (error) {

        document.getElementById(
            "error"
        ).textContent =
            "Erro:\n"
            + error.message;

    }

}


/* =====================================================
   INICIAR
===================================================== */

initialize();

</script>

</body>

</html>
