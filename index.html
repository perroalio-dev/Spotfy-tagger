<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Tagger</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: #111;
    color: white;
}

h1 {
    margin-bottom: 5px;
}

button {
    padding: 10px 15px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #222;
    color: white;
    width: calc(100% - 25px);
}

.card {
    background: #1d1d1d;
    padding: 15px;
    border-radius: 12px;
    margin: 10px 0;
}

.tag {
    display: inline-block;
    background: #333;
    padding: 5px 8px;
    margin: 3px;
    border-radius: 6px;
}

.small {
    color: #aaa;
    font-size: 14px;
}

#app {
    display: none;
}
</style>
</head>

<body>

<h1>🎵 Spotify Tagger</h1>
<p class="small">Organizador pessoal de músicas</p>

<div id="login">
    <button onclick="login()">Entrar com Spotify</button>
</div>

<div id="app">

    <h2>🔎 Descobrir músicas</h2>

    <input
        id="search"
        placeholder="Ex: genre:metal"
        onkeydown="if(event.key==='Enter') searchSpotify()"
    >

    <button onclick="searchSpotify()">Pesquisar</button>

    <div id="results"></div>

    <hr>

    <h2>🏷️ Minhas tags</h2>

    <input
        id="newTag"
        placeholder="Ex: Neo-Classical"
    >

    <button onclick="addTag()">Adicionar tag</button>

    <div id="tags"></div>

    <hr>

    <h2>🎵 Criar playlist</h2>

    <input
        id="playlistName"
        placeholder="Nome da playlist"
    >

    <button onclick="createPlaylist()">
        Criar playlist com a tag selecionada
    </button>

    <div id="status"></div>

</div>

<script>

const CLIENT_ID = "980934f51c13469db6110b783f5c6f5b";

const REDIRECT_URI =
    "https://perroalio-dev.github.io/Spotfy-tagger/";

const SCOPES =
    "playlist-modify-public playlist-modify-private";

let accessToken = null;

let tags =
    JSON.parse(localStorage.getItem("spotifyTags") || "{}");

let selectedTag = null;


/* -------------------------
   PKCE
------------------------- */

function randomString(length) {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    for (let i = 0; i < length; i++) {

        result +=
            chars.charAt(
                Math.floor(Math.random() * chars.length)
            );

    }

    return result;
}


async function sha256(plain) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(plain);

    return await crypto.subtle.digest(
        "SHA-256",
        data
    );
}


function base64url(input) {

    return btoa(
        String.fromCharCode(...new Uint8Array(input))
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


/* -------------------------
   LOGIN
------------------------- */

async function login() {

    const verifier =
        randomString(64);

    localStorage.setItem(
        "code_verifier",
        verifier
    );

    const hash =
        await sha256(verifier);

    const challenge =
        base64url(hash);

    const params =
        new URLSearchParams({

            client_id: CLIENT_ID,

            response_type: "code",

            redirect_uri: REDIRECT_URI,

            code_challenge_method: "S256",

            code_challenge: challenge,

            scope: SCOPES

        });

    window.location =
        "https://accounts.spotify.com/authorize?"
        + params.toString();
}


/* -------------------------
   TOKEN
------------------------- */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    if (!code) return;

    const verifier =
        localStorage.getItem(
            "code_verifier"
        );

    const body =
        new URLSearchParams({

            client_id: CLIENT_ID,

            grant_type:
                "authorization_code",

            code: code,

            redirect_uri:
                REDIRECT_URI,

            code_verifier:
                verifier

        });

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: body
            }
        );

    const data =
        await response.json();

    if (data.access_token) {

        accessToken =
            data.access_token;

        localStorage.setItem(
            "spotifyToken",
            accessToken
        );

        window.history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        showApp();

    } else {

        document.body.innerHTML +=
            "<p>Erro ao entrar no Spotify.</p>";

        console.log(data);
    }
}


/* -------------------------
   SEARCH
------------------------- */

async function searchSpotify() {

    const query =
        document.getElementById("search").value;

    if (!query) return;

    const response =
        await fetch(
            "https://api.spotify.com/v1/search?"
            + new URLSearchParams({

                q: query,

                type: "track,artist",

                limit: 20

            }),

            {
                headers: {

                    Authorization:
                        "Bearer " + accessToken

                }
            }
        );

    const data =
        await response.json();

    const container =
        document.getElementById("results");

    container.innerHTML = "";

    if (data.tracks) {

        data.tracks.items.forEach(track => {

            const div =
                document.createElement("div");

            div.className = "card";

            div.innerHTML = `

                <strong>
                    ${escapeHTML(track.name)}
                </strong>

                <div class="small">
                    ${escapeHTML(
                        track.artists
                            .map(a => a.name)
                            .join(", ")
                    )}
                </div>

                <button
                    onclick="tagTrack('${track.id}')"
                >
                    🏷️ Adicionar tag
                </button>
            `;

            container.appendChild(div);

        });

    }

}


/* -------------------------
   TAGGING
------------------------- */

function tagTrack(id) {

    if (!selectedTag) {

        alert(
            "Primeiro selecione uma tag."
        );

        return;
    }

    if (!tags[selectedTag])
        tags[selectedTag] = [];

    if (!tags[selectedTag].includes(id))
        tags[selectedTag].push(id);

    localStorage.setItem(
        "spotifyTags",
        JSON.stringify(tags)
    );

    updateTags();

    alert(
        "Música adicionada à tag: "
        + selectedTag
    );
}


function addTag() {

    const input =
        document.getElementById("newTag");

    const name =
        input.value.trim();

    if (!name) return;

    if (!tags[name])
        tags[name] = [];

    localStorage.setItem(
        "spotifyTags",
        JSON.stringify(tags)
    );

    input.value = "";

    updateTags();
}


function updateTags() {

    const container =
        document.getElementById("tags");

    container.innerHTML = "";

    Object.keys(tags).forEach(tag => {

        const button =
            document.createElement("button");

        button.innerText =
            tag + " (" + tags[tag].length + ")";

        button.onclick = () => {

            selectedTag = tag;

            alert(
                "Tag selecionada: " + tag
            );

        };

        container.appendChild(button);

    });
}


/* -------------------------
   PLAYLIST
------------------------- */

async function createPlaylist() {

    if (!selectedTag) {

        alert(
            "Selecione uma tag primeiro."
        );

        return;
    }

    const name =
        document.getElementById(
            "playlistName"
        ).value
        || selectedTag;

    const profile =
        await fetch(
            "https://api.spotify.com/v1/me",
            {
                headers: {
                    Authorization:
                        "Bearer " + accessToken
                }
            }
        );

    const user =
        await profile.json();

    const playlistResponse =
        await fetch(
            `https://api.spotify.com/v1/users/${user.id}/playlists`,
            {
                method: "POST",

                headers: {

                    Authorization:
                        "Bearer " + accessToken,

                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    public: false,

                    description:
                        "Criada pelo meu Spotify Tagger"

                })
            }
        );

    const playlist =
        await playlistResponse.json();

    const ids =
        tags[selectedTag];

    const uris =
        ids.map(
            id => "spotify:track:" + id
        );

    for (
        let i = 0;
        i < uris.length;
        i += 100
    ) {

        await fetch(
            `https://api.spotify.com/v1/playlists/${playlist.id}/items`,
            {
                method: "POST",

                headers: {

                    Authorization:
                        "Bearer " + accessToken,

                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    uris:
                        uris.slice(i, i + 100)

                })
            }
        );

    }

    document.getElementById(
        "status"
    ).innerHTML =
        `<p>✅ Playlist criada!</p>`;

}


/* -------------------------
   UTILS
------------------------- */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function showApp() {

    document.getElementById(
        "login"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "block";

    updateTags();
}


/* -------------------------
   START
------------------------- */

const savedToken =
    localStorage.getItem(
        "spotifyToken"
    );

if (savedToken) {

    accessToken =
        savedToken;

    showApp();

} else {

    handleCallback();

}

</script>

</body>
      </html>
