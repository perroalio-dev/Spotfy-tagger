<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Tagger</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: #111;
    color: white;
}

button {
    padding: 10px 15px;
    border: 0;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #222;
    color: white;
    width: calc(100% - 25px);
    margin-bottom: 10px;
}

.card {
    background: #1d1d1d;
    padding: 15px;
    border-radius: 12px;
    margin: 10px 0;
}

.small {
    color: #aaa;
    font-size: 14px;
}

#error {
    color: #ff7777;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>🎵 Spotify Tagger</h1>

<div id="login">
    <p>Organizador pessoal de músicas.</p>
    <button onclick="login()">Entrar com Spotify</button>
</div>

<div id="app" style="display:none">

    <h2>🔎 Descobrir</h2>

    <input
        id="search"
        placeholder="Ex: genre:metal"
    >

    <button onclick="searchSpotify()">
        Pesquisar
    </button>

    <div id="results"></div>

    <hr>

    <h2>🏷️ Tags</h2>

    <input
        id="newTag"
        placeholder="Ex: Neo-Classical"
    >

    <button onclick="addTag()">
        Criar tag
    </button>

    <div id="tags"></div>

    <hr>

    <h2>🎵 Playlist</h2>

    <input
        id="playlistName"
        placeholder="Nome da playlist"
    >

    <button onclick="createPlaylist()">
        Criar playlist da tag
    </button>

    <p id="status"></p>

</div>

<div id="error"></div>

<script>

const CLIENT_ID =
    "980934f51c13469db6110b783f5c6f5b";

const REDIRECT_URI =
    "https://perroalio-dev.github.io/Spotify-tagger/";

const SCOPES =
    "playlist-modify-public playlist-modify-private";

let accessToken = null;

let tags =
    JSON.parse(
        localStorage.getItem("spotifyTags") || "{}"
    );

let selectedTag = null;


/* =========================
   PKCE
========================= */

function generateRandomString(length) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    for (let i = 0; i < length; i++) {

        result +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );
    }

    return result;
}


async function sha256(plain) {

    const encoder =
        new TextEncoder();

    const data =
        encoder.encode(plain);

    return await crypto.subtle.digest(
        "SHA-256",
        data
    );
}


function base64url(buffer) {

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(buffer)
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


/* =========================
   LOGIN
========================= */

async function login() {

    const verifier =
        generateRandomString(64);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );

    const hashed =
        await sha256(verifier);

    const challenge =
        base64url(hashed);

    const params =
        new URLSearchParams({

            client_id:
                CLIENT_ID,

            response_type:
                "code",

            redirect_uri:
                REDIRECT_URI,

            code_challenge_method:
                "S256",

            code_challenge:
                challenge,

            scope:
                SCOPES
        });

    window.location =
        "https://accounts.spotify.com/authorize?"
        + params.toString();
}


/* =========================
   TOKEN
========================= */

async function exchangeCode(code) {

    const verifier =
        localStorage.getItem(
            "spotify_code_verifier"
        );

    if (!verifier) {

        throw new Error(
            "Código PKCE não encontrado. Tente entrar novamente."
        );
    }

    const body =
        new URLSearchParams({

            client_id:
                CLIENT_ID,

            grant_type:
                "authorization_code",

            code:
                code,

            redirect_uri:
                REDIRECT_URI,

            code_verifier:
                verifier
        });

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    body
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            JSON.stringify(data, null, 2)
        );
    }

    accessToken =
        data.access_token;

    localStorage.setItem(
        "spotify_access_token",
        accessToken
    );

    localStorage.removeItem(
        "spotify_code_verifier"
    );
}


/* =========================
   CALLBACK
========================= */

async function handleCallback() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const error =
        params.get("error");

    if (error) {

        throw new Error(
            "Spotify recusou a autorização: "
            + error
        );
    }

    const code =
        params.get("code");

    if (!code) return;

    await exchangeCode(code);

    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );
}


/* =========================
   SEARCH
========================= */

async function searchSpotify() {

    const query =
        document
            .getElementById("search")
            .value
            .trim();

    if (!query) return;

    const response =
        await fetch(
            "https://api.spotify.com/v1/search?"
            + new URLSearchParams({

                q:
                    query,

                type:
                    "track,artist",

                limit:
                    "20"
            }),

            {
                headers: {
                    Authorization:
                        "Bearer "
                        + accessToken
                }
            }
        );

    const data =
        await response.json();

    const results =
        document.getElementById(
            "results"
        );

    results.innerHTML = "";

    if (
        data.tracks &&
        data.tracks.items
    ) {

        data.tracks.items.forEach(
            track => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card";

                card.innerHTML = `
                    <strong>
                        ${escapeHTML(track.name)}
                    </strong>

                    <div class="small">
                        ${escapeHTML(
                            track.artists
                                .map(
                                    a => a.name
                                )
                                .join(", ")
                        )}
                    </div>

                    <button>
                        🏷️ Adicionar à tag
                    </button>
                `;

                card
                    .querySelector("button")
                    .onclick = () =>
                        tagTrack(track.id);

                results.appendChild(
                    card
                );
            }
        );
    }
}


/* =========================
   TAGS
========================= */

function addTag() {

    const input =
        document.getElementById(
            "newTag"
        );

    const name =
        input.value.trim();

    if (!name) return;

    if (!tags[name])
        tags[name] = [];

    localStorage.setItem(
        "spotifyTags",
        JSON.stringify(tags)
    );

    input.value = "";

    updateTags();
}


function updateTags() {

    const container =
        document.getElementById(
            "tags"
        );

    container.innerHTML = "";

    Object.keys(tags).forEach(
        tag => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                tag
                + " ("
                + tags[tag].length
                + ")";

            button.onclick = () => {

                selectedTag =
                    tag;

                alert(
                    "Tag selecionada: "
                    + tag
                );
            };

            container.appendChild(
                button
            );
        }
    );
}


function tagTrack(id) {

    if (!selectedTag) {

        alert(
            "Crie e selecione uma tag primeiro."
        );

        return;
    }

    if (!tags[selectedTag])
        tags[selectedTag] = [];

    if (
        !tags[selectedTag]
            .includes(id)
    ) {

        tags[selectedTag].push(id);
    }

    localStorage.setItem(
        "spotifyTags",
        JSON.stringify(tags)
    );

    updateTags();

    alert(
        "Música adicionada à tag "
        + selectedTag
    );
}


/* =========================
   PLAYLIST
========================= */

async function createPlaylist() {

    if (!selectedTag) {

        alert(
            "Selecione uma tag primeiro."
        );

        return;
    }

    const name =
        document
            .getElementById(
                "playlistName"
            )
            .value
            .trim()
        || selectedTag;

    const response =
        await fetch(
            "https://api.spotify.com/v1/me/playlists",
            {
                method: "POST",

                headers: {

                    Authorization:
                        "Bearer "
                        + accessToken,

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        name:
                            name,

                        public:
                            false,

                        description:
                            "Criada pelo Spotify Tagger"
                    })
            }
        );

    const playlist =
        await response.json();

    if (!response.ok) {

        throw new Error(
            JSON.stringify(
                playlist,
                null,
                2
            )
        );
    }

    const ids =
        tags[selectedTag];

    const uris =
        ids.map(
            id =>
                "spotify:track:"
                + id
        );

    for (
        let i = 0;
        i < uris.length;
        i += 100
    ) {

        await fetch(
            `https://api.spotify.com/v1/playlists/${playlist.id}/items`,
            {
                method: "POST",

                headers: {

                    Authorization:
                        "Bearer "
                        + accessToken,

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        uris:
                            uris.slice(
                                i,
                                i + 100
                            )
                    })
            }
        );
    }

    document.getElementById(
        "status"
    ).textContent =
        "✅ Playlist criada no Spotify!";
}


/* =========================
   UTIL
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================
   START
========================= */

async function start() {

    try {

        const saved =
            localStorage.getItem(
                "spotify_access_token"
            );

        if (saved) {

            accessToken =
                saved;

            showApp();

            return;
        }

        await handleCallback();

        if (accessToken) {

            showApp();

        }

    } catch (error) {

        console.error(error);

        document.getElementById(
            "error"
        ).textContent =
            "Erro:\n"
            + error.message;
    }
}


function showApp() {

    document.getElementById(
        "login"
    ).style.display =
        "none";

    document.getElementById(
        "app"
    ).style.display =
        "block";

    updateTags();
}


start();

</script>

</body>
</html>
